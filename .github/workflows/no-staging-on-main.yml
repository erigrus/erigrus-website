name: No staging on main

# /staging/ is a preview-only mirror that must never ship to the live site.
# This guard fails if it ever lands on `main`. See CLAUDE.md.
on:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if staging/ is present
        run: |
          if [ -d staging ]; then
            echo "::error::/staging/ must not exist on main. It is a preview-only mirror — run scripts/clean-staging.sh, commit the removal, and push."
            exit 1
          fi
          echo "OK: no staging/ on main."
