name: Deploy site to GitHub Pages

# Production deploy: assemble the site and publish it to the `gh-pages` branch.
# Pages must be configured to serve from `gh-pages` / root (one-time settings
# switch — see README.md). Pushing to `main` is still "edit, push, live".
#
# Triggers: a `push` to main, AND a merged pull request into main. The second
# one is not redundant. Merging PR #12 produced no run at all for this workflow
# (zero runs for merge commit 3af1319) while the pull_request event from the
# same merge arrived normally, and the site kept serving the previous build
# until the deploy was dispatched by hand. The cause was never established — a
# dropped event during an Actions wobble is the likeliest reading — but a
# deploy that hangs on a single event delivery is one delivery away from
# silently not happening, so it listens for both. When a merge fires both, they
# queue on the concurrency group below and the second run is a no-op (the
# publish action skips when the built site is unchanged).
on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

# Production deploys get their own lock so a burst of PR-preview events can
# never cancel a production deploy. Never cancel an in-progress deploy.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  deploy:
    # Every trigger except pull_request means "publish main". A pull_request
    # run only counts when it actually merged into main — closing a PR
    # unmerged must not deploy.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.merged == true
          && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      # Always build from main, never from a PR's merge ref.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='scripts' \
            --exclude='_site' \
            --exclude='README.md' \
            --exclude='CLAUDE.md' \
            --exclude='.gitignore' \
            --exclude='staging' \
            ./ _site/

      - name: Publish to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
          # Never wipe live PR previews on a production deploy.
          clean-exclude: |
            pr-preview/
